<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: #f0f0f0;
            font-family: sans-serif;
            text-align: center;
        }
.card{
width: 300px;
margin: 50px auto;
padding: 20px;
background-color: white;
border-radius: 15px;
overflow: hidden;
padding-bottom: 20px;
text-align: center;
box-shadow: 0 0 10px #ccc;
}
.header{
    background: blue;
    height: 120px;
}
h2{
    color: #333 ;
    margin: 0;
}
h1{
    margin: 10px 0 5px;

}
p{
    color: #555;
    padding: 0 20px;
}
.social{
    display: flex;
    justify-content: space-around;
    padding: 15px 30px;
    font-weight: bold;
}
.social span{
    width: 40px;
    height: 40px;
    border-radius: 50%;
background-color: #eef1ff;
color:blue;
display: flex;
align-items: center;
justify-content: center;
font-weight: bold;
font-size: 13px;
}



img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 5px solid white;
    margin-top: -60px;
    position: relative;
    z-index: 2;
    object-fit: cover;
}
button{
    background: blue;
    color: white;
    width: 90%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;


}





    </style>
</head>
<body>
    <div class="card">
        <div class="header"></div>
        <img src="../photos/IMG_5191.jpg">
    <h1>Nasim</h1>
    <h2>Web Developer</h2>
    <p>Hello! I'm a web developer passionate about creating amazing digital experiences.<br>This is my first HTML and CSS project.</p>
   <div class="social">
    <span>FB</span>
    <span>IG</span>
    <span>TW</span>
    <span>IN</span>
   </div>
 <button>
    Contact Me
   </button>
   
    </div>
    
</body>
</html>
